<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Launcher — Seus Jogos</h1>
    <div class="controls">
      <input id="search" placeholder="Pesquisar jogos..." />
      <button id="refresh">Atualizar</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <p id="noGames" class="no-games" style="display:none">Nenhum jogo encontrado.</p>
  </main>

  <div class="preview-panel" id="previewPanel" aria-hidden="true">
    <button id="previewClose" class="preview-close">✕</button>
    <div class="preview-header">
      <img id="previewIcon" alt="ícone" />
      <div>
        <div id="previewName" class="preview-name"></div>
        <div id="previewMeta" class="preview-meta"></div>
      </div>
    </div>
    <div class="preview-body">
      <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
      <div class="preview-actions">
        <button id="openInTab">Abrir em nova aba</button>
        <button id="openInIframe">Jogar aqui</button>
      </div>
    </div>
  </div>

  <footer><span id="status">Carregando...</span></footer>

  <script src="launcher.js"></script>
</body>
</html>
