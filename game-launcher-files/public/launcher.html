<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Meu Launcher de Jogos</h1>
  </header>

  <main class="main">
    <section class="games-list">
      <h2>Jogos disponíveis</h2>
      <div class="game-card">
        <img src="../Rpg-craft/icon.png" alt="Rpg-craft" class="game-thumb">
        <div class="game-info">
          <h3>Rpg-craft</h3>
          <p>Multiplayer shooter / RPG</p>
          <!-- botão tenta abrir no endereço completo (porta do server do jogo) -->
          <div class="actions">
            <button class="btn-open" data-url="http://localhost:4000/">Abrir (porta 4000)</button>
            <!-- fallback relativo caso você sirva tudo no mesmo servidor -->
            <button class="btn-open" data-url="/Rpg-craft/">Abrir (caminho relativo)</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- OVERLAY com IFRAME -->
  <div id="game-overlay" class="hidden">
    <div id="game-overlay-inner">
      <button id="close-game" title="Fechar">✕ Voltar</button>
      <iframe id="gameFrame" src="about:blank" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <footer class="footer">
    <small>Dica: se o jogo usar sockets em porta diferente, use a versão com host:porta.</small>
  </footer>

  <script src="launcher.js"></script>
</body>
</html>
